name: Wiki checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC to proactively monitor freshness and review_by expiry
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python3 -m unittest discover -s _meta/scripts -p 'test_*.py' -v
      - name: Catalog synchronization check
        run: python3 _meta/scripts/wiki_catalog.py --root "$GITHUB_WORKSPACE" --check
      - name: Wiki health
        run: python3 _meta/scripts/wiki_health_check.py --root "$GITHUB_WORKSPACE" --format markdown
      - name: Freshness scan
        run: python3 _meta/scripts/wiki_maintain.py --root "$GITHUB_WORKSPACE" --freshness --days 30
      - name: Tag audit
        run: python3 _meta/scripts/wiki_tag_audit.py --root "$GITHUB_WORKSPACE"
      - name: Public-content check
        run: python3 _meta/scripts/wiki_public_content_check.py --root "$GITHUB_WORKSPACE"
      - name: Commit-range whitespace check
        # Needs a commit range; on schedule/manual runs there is none and the
        # fallback would diff the whole tree, including raw captures.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "$PR_BASE_SHA" "$GITHUB_SHA")
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$base" "$GITHUB_SHA"

  # Network-dependent, so kept out of the deterministic job above and run only
  # on the weekly schedule or by hand. Scope and tolerances: _meta/lychee.toml.
  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache lychee results
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - name: External link liveness (formal pages)
        # lycheeverse/lychee-action v2.9.0, pinned by commit SHA
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: v0.24.2
          jobSummary: true
          args: >-
            -c _meta/lychee.toml
            'entities/**/*.md' 'concepts/**/*.md' 'queries/**/*.md' 'comparisons/**/*.md' 'operations/**/*.md'
